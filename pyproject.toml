[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "korchestrator"
dynamic = ["version"]
description = "Durable multi-agent execution kernel: Pregel BSP supersteps, Temporal durability, typed compiled signatures."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Kendra Laboratories Limited" }]
keywords = ["agents", "orchestration", "multi-agent", "temporal", "pregel", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
# The `dspy-ai` distribution now redirects to the modern `dspy` package (3.x); target it directly
# so the pin actually constrains the installed module. See ADR 0013.
dspy = ["dspy>=2.6,<4"]
temporal = ["temporalio>=1.7,<2"]
# numpy<2.5: 2.5.x's bundled .pyi stubs use a PEP 695 `type` statement (Python 3.12+ only), which
# breaks `mypy --strict` under this project's python_version = "3.10" (requires-python floor).
# follow_imports = "skip" does not help — mypy reports the stub's syntax error before semantic
# analysis (where follow_imports applies) ever runs. Revisit once numpy ships 3.10-compatible
# stubs again or this project's minimum Python version rises to 3.12.
#
# sentence-transformers>=5.2 (not >=3.0): the >=3.0,<4 floor previously here resolved
# transformers 4.57.6, which carries known vulnerabilities (PYSEC-2026-2288/2289/2290) fixed in
# transformers 5.0/5.3/5.5 respectively. sentence-transformers<5.2 caps transformers at <5.0
# (verified against every 3.x/4.x/5.0-5.1 release's own metadata), so the transformers floor below
# is unreachable without this bump too. `korchestrator.routing.semantic` only calls
# `SentenceTransformer(name)` and `.encode(texts)` — the library's oldest, most stable surface —
# verified compatible by actually downloading `all-MiniLM-L6-v2` and encoding real text against
# sentence-transformers 5.7.0 / transformers 5.15.0 before this bump landed.
routing = ["sentence-transformers>=5.2,<6", "transformers>=5.5,<6", "numpy>=1.26,<2.5"]
mcp = ["mcp>=1.2,<2"]
remote = ["httpx>=0.27,<1"]
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
]
all = [
  "korchestrator[dspy]",
  "korchestrator[temporal]",
  "korchestrator[routing]",
  "korchestrator[mcp]",
  "korchestrator[remote]",
  "korchestrator[otel]",
]
dev = [
  "korchestrator[all]",
  "build>=1.2",
  "bandit>=1.7",
  "hypothesis>=6.100",
  "import-linter>=2.0",
  "mypy>=1.10",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/kendralabs/korch-sdk"
Documentation = "https://kendralabs.github.io/korch-sdk"
Changelog = "https://github.com/kendralabs/korch-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/kendralabs/korch-sdk/issues"

# --- build -----------------------------------------------------------------

[tool.hatch.version]
path = "src/korchestrator/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/korchestrator"]

[tool.hatch.build.targets.sdist]
include = ["src/korchestrator", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

# --- lint / format ---------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "PTH", "RUF", "D", "ANN", "S", "T20"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101"]
"benchmarks/**" = ["D", "ANN", "S101"]
"examples/**" = ["D", "ANN", "T201", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"backend".msg = "The SDK must not import from application repositories."
"apps".msg = "The SDK must not import from application repositories."
"services".msg = "The SDK must not import from application repositories."
"frontend".msg = "The SDK must not import from application repositories."

# --- types -----------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/korchestrator"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["dspy.*", "temporalio.*", "mcp.*", "sentence_transformers.*"]
ignore_missing_imports = true

# --- tests -----------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# "bench_*.py" (not "test_*.py") is the benchmarks/ naming convention (spec 09 §8) — without it,
# bare-directory collection (`pytest benchmarks -m benchmark`) silently finds nothing; only an
# explicit file path bypasses python_files' default glob.
python_files = ["test_*.py", "bench_*.py"]
# Repo root on sys.path so tests/unit/test_config_isolation.py can import the reusable
# scripts.check_env_reads module (one canonical env-isolation check, not two).
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
asyncio_mode = "auto"
markers = [
  "slow: takes more than one second; excluded from the fast unit run",
  "temporal: requires the [temporal] extra and a Temporal test environment",
  "benchmark: performance measurement; never part of the blocking gate",
]
filterwarnings = [
  "error",
  "default::DeprecationWarning:korchestrator.*",
  # dspy emits import-time DeprecationWarnings from its own signatures; they are third-party and
  # must not fail (or clutter) our suite. Our code's warnings still error.
  "ignore::DeprecationWarning:dspy.*",
]

# --- coverage --------------------------------------------------------------

[tool.coverage.run]
source = ["korchestrator"]
branch = true
parallel = true

[tool.coverage.report]
# Ratcheted from 80 at P10.6 — actually achieved is ~97% (excluding the local Temporal-environment
# gap tracked in PROJECT_STATE.md); floor set with headroom below that, not pinned to it, since the
# CI matrix (3.10-3.13) and the Temporal-marked tests (which don't run in every local dev
# environment) can shift the exact number. Ratchet up again as the achieved level rises; never down
# to make a change pass (testing.md T8).
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  # Protocol / stub method bodies are non-executable placeholders (like @overload above).
  "^\\s*\\.\\.\\.$",
]

[tool.bandit]
exclude_dirs = ["tests", "benchmarks", "examples"]
