name: Release

# Tag-triggered release pipeline (ADR 0021, supersedes ADR 0020's private-distribution pass).
# Builds and verifies the artifact in a clean environment, generates an SBOM and checksums,
# attests build provenance, publishes to PyPI via Trusted Publishing (OIDC — no stored API
# token), publishes a GitHub Release with the artifacts attached, verifies the real public
# `pip install korchestrator` path, and redeploys documentation. Matches
# docs/specs/10-release-versioning-and-cicd.md §6.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, verify, and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install build

      - name: Version must match the tag
        id: version
        run: |
          python scripts/validate_version.py
          value=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('src/korchestrator/version.py').read_text()).group(1))")
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Build wheel and sdist
        run: python -m build

      # Verify the ARTIFACT, never the source tree — this catches packaging defects a
      # source-tree test cannot see.
      - name: Verify the built wheel in a clean environment
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install --upgrade pip
          /tmp/verify/bin/python -m pip install dist/*.whl
          cd /tmp   # leave the source tree so imports cannot resolve locally
          /tmp/verify/bin/python -c "
          import korchestrator
          assert korchestrator.__version__ == '${{ steps.version.outputs.value }}', \
              korchestrator.__version__
          print('artifact verified:', korchestrator.__version__)
          "

      - name: Verify the sdist builds a wheel
        run: |
          python -m venv /tmp/sdist
          /tmp/sdist/bin/python -m pip install --upgrade pip build
          /tmp/sdist/bin/python -m pip install dist/*.tar.gz

      - name: Generate SBOM (CycloneDX)
        run: |
          python -m pip install "cyclonedx-bom>=7,<8"
          cyclonedx-py environment --output-format json --output-file dist/sbom.cdx.json

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.whl ./*.tar.gz ./sbom.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*.whl,dist/*.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/korchestrator
    permissions:
      id-token: write # Trusted Publishing (OIDC); no API token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - name: Remove non-distribution files before upload
        run: rm -f dist/SHA256SUMS dist/sbom.cdx.json
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  github-release:
    name: Publish the GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - name: Extract the CHANGELOG section for this version
        run: |
          awk -v v="${{ needs.build.outputs.version }}" '
            $0 ~ "^## \\["v"\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "no CHANGELOG section found"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true

  verify-published:
    name: Install from PyPI
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the published distribution and import it
        run: |
          for attempt in 1 2 3 4 5; do
            if python -m pip install "korchestrator==${{ needs.build.outputs.version }}"; then
              break
            fi
            echo "index not ready yet (attempt $attempt)"
            [ "$attempt" -lt 5 ] || exit 1
            sleep 15
          done
          python -c "import korchestrator; print(korchestrator.__version__)"

  deploy-docs:
    name: Deploy documentation for the release
    needs: publish
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
