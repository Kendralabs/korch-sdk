name: Release

# Tag-triggered release skeleton (P0.8). It validates the version and verifies the BUILT
# artifact in a clean environment on a `vX.Y.Z` tag. Publishing to PyPI via Trusted
# Publishing, SBOM/checksum generation, provenance attestation, the GitHub release, and the
# docs deploy are wired in Phase 12 (see docs/specs/10-release-versioning-and-cicd.md §6).
# No job here publishes anything yet.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify the artifact
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install build

      - name: Version must match the tag
        id: version
        run: |
          python scripts/validate_version.py
          value=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('src/korchestrator/version.py').read_text()).group(1))")
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Build wheel and sdist
        run: python -m build

      # Verify the ARTIFACT, never the source tree — this catches packaging defects a
      # source-tree test cannot see.
      - name: Verify the built wheel in a clean environment
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install --upgrade pip
          /tmp/verify/bin/python -m pip install dist/*.whl
          cd /tmp   # leave the source tree so imports cannot resolve locally
          /tmp/verify/bin/python -c "
          import korchestrator
          assert korchestrator.__version__ == '${{ steps.version.outputs.value }}', \
              korchestrator.__version__
          print('artifact verified:', korchestrator.__version__)
          "

      - name: Verify the sdist builds a wheel
        run: |
          python -m venv /tmp/sdist
          /tmp/sdist/bin/python -m pip install --upgrade pip build
          /tmp/sdist/bin/python -m pip install dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  # ---------------------------------------------------------------------------------------
  # Phase 12 wires the remaining jobs here, each gated on `build`:
  #   publish          — PyPI Trusted Publishing (OIDC, no stored token)
  #   github-release   — GitHub release with notes drawn from CHANGELOG.md
  #   verify-published — install from PyPI and import
  #   deploy-docs      — reuse .github/workflows/docs.yml
  # See docs/specs/10-release-versioning-and-cicd.md §6 for the full pipeline.
  # ---------------------------------------------------------------------------------------
