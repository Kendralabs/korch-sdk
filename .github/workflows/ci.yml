name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  static:
    name: Lint, format, types, gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/korchestrator tests examples benchmarks
      - name: Format
        run: ruff format --check src/korchestrator tests examples benchmarks
      - name: Types
        run: mypy --strict src/korchestrator
      - name: Docstring examples (offline)
        run: pytest --doctest-modules src/korchestrator
      - name: Import contracts (layering, isolation, no cycles)
        run: lint-imports
      - name: Import-isolation gate
        run: bash scripts/check_isolation.sh
      - name: Environment reads confined to config/
        run: python scripts/check_env_reads.py
      - name: Version single-sourcing
        run: python scripts/validate_version.py

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run test suite with coverage
        # The `temporal` marker runs in its own clean-[temporal] job below: Temporal's workflow
        # sandbox conflicts with import hooks (e.g. beartype) that observability extras can pull in.
        run: pytest tests -m "not temporal" --cov=korchestrator --cov-report=term-missing --cov-report=xml
      - name: Enforce per-package coverage floors
        # Ratcheted at P10.6: core/ measured ~98%, models/ 100% locally (excl. the Temporal-
        # environment gap tracked in PROJECT_STATE.md); floors set with headroom below that.
        run: |
          coverage report --include="src/korchestrator/core/*" --fail-under=97
          coverage report --include="src/korchestrator/models/*" --fail-under=99

  temporal:
    name: Temporal runtime suite ([temporal] extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # A clean [temporal] install — no observability extras, so nothing installs a global import
      # hook that would break Temporal's workflow sandbox. Uses the bundled time-skipping test server.
      - run: python -m pip install -e ".[temporal]" pytest pytest-asyncio
      - name: Run the Temporal integration and e2e suites
        run: pytest tests -m temporal

  base-install:
    name: Kernel suite on a pydantic-only install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with no extras
        # hypothesis is a test tool (like pytest), not a package runtime dependency — the kernel
        # law tests under tests/unit/core need it; the "optional deps absent" check below still
        # guards the real extras (dspy/temporalio/httpx/mcp/otel).
        run: python -m pip install . pytest pytest-asyncio hypothesis
      - name: Assert optional dependencies are absent
        run: |
          python - <<'PY'
          import importlib.util, sys
          forbidden = ["dspy", "temporalio", "httpx", "mcp", "opentelemetry"]
          present = [m for m in forbidden if importlib.util.find_spec(m) is not None]
          if present:
              sys.exit(f"optional dependencies leaked into the base install: {present}")
          print("base install is clean")
          PY
      - name: Assert importing the package pulls in no optional dependency
        run: |
          python - <<'PY'
          import sys
          import korchestrator  # noqa: F401
          leaked = [m for m in ("dspy", "temporalio", "httpx", "mcp") if m in sys.modules]
          if leaked:
              sys.exit(f"import korchestrator eagerly imported: {leaked}")
          print("import graph is lazy")
          PY
      - name: Kernel and smoke tests
        run: pytest tests/unit/core tests/unit/models tests/smoke

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Static analysis
        run: bandit -c pyproject.toml -r src/korchestrator
      - name: Dependency audit
        # --skip-editable: korchestrator itself is installed editable (`pip install -e .`) and is
        # not published to any index (ADR 0020) — pip-audit can't look it up and fails outright
        # without this flag. Every real third-party dependency is still fully audited.
        #
        # No --strict: pip-audit's --strict counts a --skip-editable skip as a collection failure
        # too (confirmed empirically — it fails even though the package was deliberately, not
        # accidentally, excluded), which defeats the point of combining the two flags. Without
        # --strict, pip-audit still exits non-zero on any *actual* reported vulnerability; it only
        # stops hard-failing on the one skip we asked for.
        run: pip-audit --skip-editable
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and verify the artifact
    runs-on: ubuntu-latest
    needs: [static, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - name: Build wheel and sdist
        run: python -m build
      - name: Install the built wheel in a clean environment and smoke-test it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --upgrade pip
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/python -c "import korchestrator; print(korchestrator.__version__)"
          /tmp/clean/bin/python -c "from korchestrator.config import Settings; print(Settings().korch_runtime)"
      - name: Verify py.typed is present in the wheel
        run: python -m zipfile -l dist/*.whl | grep -q "korchestrator/py.typed"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  examples:
    name: Examples run offline
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      MOCK_LLM: "true"
      KORCH_RUNTIME: local
      PERSISTENCE_BACKEND: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[all]"
      - name: Execute every example (no-op until examples land in P11)
        run: |
          shopt -s nullglob
          for f in examples/*.py; do echo "== $f"; python "$f"; done

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: mkdocs build --strict

  benchmarks:
    name: Benchmarks (informational)
    # Manual dispatch or a push to main only (release branches) — never on a PR, and never
    # blocking (spec 09 §8: "benchmark numbers on shared CI runners are too noisy to gate on").
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Save the committed baseline for comparison
        run: cp benchmarks/baseline.json /tmp/baseline.before.json
      - name: Run benchmarks
        run: pytest benchmarks -m benchmark
      - name: Compare against the committed baseline (never fails the job)
        run: python scripts/check_benchmark_regression.py /tmp/baseline.before.json benchmarks/baseline.json
